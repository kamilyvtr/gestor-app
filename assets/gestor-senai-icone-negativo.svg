<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Gestor SENAI">
  <title>Gestor SENAI — ícone para fundos escuros</title>
  <!-- Variante clara derivada da arte oficial (mesma geometria do ícone do calendário). -->
  <defs>
    <mask id="gsCells" maskUnits="userSpaceOnUse" x="0" y="0" width="96" height="96">
      <rect width="96" height="96" fill="#000"/>
      <rect y="8" width="96" height="88" rx="24" fill="#fff"/>
      <rect x="20" width="8" height="20" rx="4" fill="#fff"/>
      <rect x="68" width="8" height="20" rx="4" fill="#fff"/>
      <rect x="16" y="40" width="16" height="16" rx="6" fill="#000"/>
      <rect x="40" y="40" width="16" height="16" rx="6" fill="#000"/>
      <rect x="64" y="40" width="16" height="16" rx="6" fill="#000"/>
      <rect x="16" y="64" width="16" height="16" rx="6" fill="#000"/>
      <rect x="40" y="64" width="16" height="16" rx="6" fill="#000"/>
    </mask>
  </defs>
  <rect width="96" height="96" fill="#FFFFFF" mask="url(#gsCells)"/>
  <circle fill="#F26522" cx="72" cy="72" r="8"/>
</svg>
